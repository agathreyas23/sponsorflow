  <text x="132" y="218" font-size="30" font-weight="800" fill="#6e655b" >@yourcollegeappadv</text>
  
    <rect x="838" y="178" width="104" height="54" rx="27" fill="#6b5843"/>
    <text x="890" y="218" font-size="31" font-weight="800" fill="#ffffff" text-anchor="middle">2/3</text>
  
  
    <text x="132" y="392" font-size="78" font-weight="900" fill="#16213d" >Your May moves</text>
    
    <g>
      <circle cx="164" cy="577" r="32" fill="#ff715b"/>
      <text x="164" y="589" font-size="31" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
      <text x="220" y="563" font-size="38" font-weight="850" fill="#16213d" >Build the list</text>
      <text x="220" y="612" font-size="28" font-weight="560" fill="#485065" >12-16 schools. Know why each</text>
<text x="220" y="651" font-size="28" font-weight="560" fill="#485065" >one fits beyond ranking.</text>
    </g>
  
    
    <g>
      <circle cx="164" cy="802" r="32" fill="#69bfae"/>
      <text x="164" y="814" font-size="31" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
      <text x="220" y="788" font-size="38" font-weight="850" fill="#16213d" >Pick your angle</text>
      <text x="220" y="837" font-size="28" font-weight="560" fill="#485065" >Choose 2-3 academic interests</text>
<text x="220" y="876" font-size="28" font-weight="560" fill="#485065" >and the story connecting them.</text>
    </g>
  
    
    <g>
      <circle cx="164" cy="1027" r="32" fill="#5d73d8"/>
      <text x="164" y="1039" font-size="31" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
      <text x="220" y="1013" font-size="38" font-weight="850" fill="#16213d" >Audit your stats</text>
      <text x="220" y="1062" font-size="28" font-weight="560" fill="#485065" >Transcript, rigor, testing plan,</text>
<text x="220" y="1101" font-size="28" font-weight="560" fill="#485065" >senior classes, weak spots.</text>
    </g>
  
    
    <g>
      <circle cx="164" cy="1252" r="32" fill="#f2b84b"/>
      <text x="164" y="1264" font-size="31" font-weight="900" fill="#ffffff" text-anchor="middle">4</text>
      <text x="220" y="1238" font-size="38" font-weight="850" fill="#16213d" >Make the brag doc</text>
      <text x="220" y="1287" font-size="28" font-weight="560" fill="#485065" >Activities, impact numbers,</text>
<text x="220" y="1326" font-size="28" font-weight="560" fill="#485065" >awards, projects, context.</text>
