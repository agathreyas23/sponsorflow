<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset="0.46" stop-color="#f7fbf8"/>
      <stop offset="1" stop-color="#edf4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#17213d" flood-opacity="0.14"/>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M 54 0 L 0 0 0 54" fill="none" stroke="#16213d" stroke-width="1" opacity="0.055"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>
  <circle cx="955" cy="96" r="164" fill="#ff715b" opacity="0.19"/>
  <circle cx="112" cy="1192" r="214" fill="#69d2c1" opacity="0.22"/>
  <rect x="74" y="74" width="932" height="1202" rx="42" fill="#fffdf8" filter="url(#shadow)" opacity="0.92"/>
  <rect x="108" y="108" width="864" height="1134" rx="34" fill="none" stroke="#16213d" stroke-width="2" opacity="0.12"/>
  <text x="132" y="168" font-size="30" font-weight="800" fill="#485065" >@yourcollegeappadv</text>
  
    <rect x="838" y="128" width="104" height="54" rx="27" fill="#16213d"/>
    <text x="890" y="168" font-size="31" font-weight="800" fill="#ffffff" text-anchor="middle">2/3</text>
  
  
    <text x="132" y="282" font-size="78" font-weight="900" fill="#16213d" >Your May moves</text>
    
    <g>
      <circle cx="164" cy="414" r="32" fill="#ff715b"/>
      <text x="164" y="426" font-size="31" font-weight="900" fill="#ffffff" text-anchor="middle">1</text>
      <text x="220" y="400" font-size="38" font-weight="850" fill="#16213d" >Build the list</text>
      <text x="220" y="449" font-size="28" font-weight="560" fill="#485065" >12-16 schools. Know why each</text>
<text x="220" y="488" font-size="28" font-weight="560" fill="#485065" >one fits beyond ranking.</text>
    </g>
  
    
    <g>
      <circle cx="164" cy="597" r="32" fill="#69bfae"/>
      <text x="164" y="609" font-size="31" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
      <text x="220" y="583" font-size="38" font-weight="850" fill="#16213d" >Pick your angle</text>
      <text x="220" y="632" font-size="28" font-weight="560" fill="#485065" >Choose 2-3 academic interests</text>
<text x="220" y="671" font-size="28" font-weight="560" fill="#485065" >and the story connecting them.</text>
    </g>
  
    
    <g>
      <circle cx="164" cy="780" r="32" fill="#5d73d8"/>
      <text x="164" y="792" font-size="31" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
      <text x="220" y="766" font-size="38" font-weight="850" fill="#16213d" >Audit your stats</text>
      <text x="220" y="815" font-size="28" font-weight="560" fill="#485065" >Transcript, rigor, testing plan,</text>
<text x="220" y="854" font-size="28" font-weight="560" fill="#485065" >senior classes, weak spots.</text>
    </g>
  
    
    <g>
      <circle cx="164" cy="963" r="32" fill="#f2b84b"/>
      <text x="164" y="975" font-size="31" font-weight="900" fill="#ffffff" text-anchor="middle">4</text>
      <text x="220" y="949" font-size="38" font-weight="850" fill="#16213d" >Make the brag doc</text>
      <text x="220" y="998" font-size="28" font-weight="560" fill="#485065" >Activities, impact numbers,</text>
<text x="220" y="1037" font-size="28" font-weight="560" fill="#485065" >awards, projects, context.</text>
    </g>
  
    <rect x="132" y="1132" width="812" height="76" rx="38" fill="#f3f5ff"/>
    <text x="538" y="1182" font-size="31" font-weight="750" fill="#16213d" text-anchor="middle">Goal: know what story your app is telling.</text>
  
