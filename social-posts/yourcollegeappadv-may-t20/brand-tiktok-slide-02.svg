  <text x="882" y="216" font-family="Avenir Next, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">2/3</text>
  
    <text x="140" y="384" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="800" fill="#332718" >Your May moves</text>
    
    <g>
      <circle cx="174" cy="584" r="24" fill="#f1e7d5" stroke="#d8c3a3" stroke-width="2"/>
      <text x="174" y="594" font-family="Avenir Next, Arial, sans-serif" font-size="24" font-weight="800" fill="#6b5843" text-anchor="middle">01</text>
      <text x="218" y="594" font-family="Georgia, 'Times New Roman', serif" font-size="39" font-weight="800" fill="#332718" >Build the list</text>
      <text x="218" y="643" font-family="Avenir Next, Arial, sans-serif" font-size="28" font-weight="600" fill="#746a5f" >12-16 schools. Know why each</text>
<text x="218" y="682" font-family="Avenir Next, Arial, sans-serif" font-size="28" font-weight="600" fill="#746a5f" >one fits beyond ranking.</text>
    </g>
  
    
    <g>
      <circle cx="174" cy="814" r="24" fill="#f1e7d5" stroke="#d8c3a3" stroke-width="2"/>
      <text x="174" y="824" font-family="Avenir Next, Arial, sans-serif" font-size="24" font-weight="800" fill="#6b5843" text-anchor="middle">02</text>
      <text x="218" y="824" font-family="Georgia, 'Times New Roman', serif" font-size="39" font-weight="800" fill="#332718" >Find your angle</text>
      <text x="218" y="873" font-family="Avenir Next, Arial, sans-serif" font-size="28" font-weight="600" fill="#746a5f" >Choose 2-3 interests and the</text>
<text x="218" y="912" font-family="Avenir Next, Arial, sans-serif" font-size="28" font-weight="600" fill="#746a5f" >story connecting them.</text>
    </g>
  
    
    <g>
      <circle cx="174" cy="1044" r="24" fill="#f1e7d5" stroke="#d8c3a3" stroke-width="2"/>
      <text x="174" y="1054" font-family="Avenir Next, Arial, sans-serif" font-size="24" font-weight="800" fill="#6b5843" text-anchor="middle">03</text>
      <text x="218" y="1054" font-family="Georgia, 'Times New Roman', serif" font-size="39" font-weight="800" fill="#332718" >Audit your stats</text>
      <text x="218" y="1103" font-family="Avenir Next, Arial, sans-serif" font-size="28" font-weight="600" fill="#746a5f" >Transcript, rigor, testing plan,</text>
<text x="218" y="1142" font-family="Avenir Next, Arial, sans-serif" font-size="28" font-weight="600" fill="#746a5f" >senior classes, weak spots.</text>
    </g>
  
    
    <g>
      <circle cx="174" cy="1274" r="24" fill="#f1e7d5" stroke="#d8c3a3" stroke-width="2"/>
      <text x="174" y="1284" font-family="Avenir Next, Arial, sans-serif" font-size="24" font-weight="800" fill="#6b5843" text-anchor="middle">04</text>
      <text x="218" y="1284" font-family="Georgia, 'Times New Roman', serif" font-size="39" font-weight="800" fill="#332718" >Make the brag doc</text>
      <text x="218" y="1333" font-family="Avenir Next, Arial, sans-serif" font-size="28" font-weight="600" fill="#746a5f" >Activities, impact numbers,</text>
<text x="218" y="1372" font-family="Avenir Next, Arial, sans-serif" font-size="28" font-weight="600" fill="#746a5f" >awards, projects, context.</text>
